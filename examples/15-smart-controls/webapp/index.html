<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Example 15 - Smart controls</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">

	<script id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-resource-roots='{
				"learn.smart": "./"
			}'
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-compat-version="edge"
			data-sap-ui-async="true"></script>

	<script>
		sap.ui.getCore().attachInit(function () {
			// Start the mock server BEFORE creating the component container:
			// the component creates its OData model in init(), and the first
			// $metadata request must find the mock already listening (M08).
			sap.ui.require(["learn/smart/util/mockserver", "sap/ui/core/ComponentContainer"],
				async function (mockserver, ComponentContainer) {
					await mockserver.startMockServer();
					new ComponentContainer({
						name: "learn.smart",
						async: true,
						height: "100%"
					}).placeAt("content");
				});
		});
	</script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
