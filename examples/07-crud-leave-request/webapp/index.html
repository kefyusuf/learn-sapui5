<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Example 07 - CRUD Leave Requests</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="css/style.css">

	<script id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-resource-roots='{
				"learn.crud": "./"
			}'
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-compat-version="edge"
			data-sap-ui-async="true"></script>

	<script>
		sap.ui.getCore().attachInit(function () {
			// Mock server first, component second - same reasoning as
			// example 06 (docs/09, M08).
			sap.ui.require(["learn/crud/util/mockserver", "sap/ui/core/ComponentContainer"],
				async function (mockserver, ComponentContainer) {
					await mockserver.startMockServer();
					new ComponentContainer({
						name: "learn.crud",
						async: true,
						height: "100%"
					}).placeAt("content");
				});
		});
	</script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
