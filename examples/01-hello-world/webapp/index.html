<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Example 01 - Hello World</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="css/style.css">

	<!-- The UI5 bootstrap. Everything a beginner needs to notice is here:
	     - src:        the UI5 runtime, served locally by `ui5 serve` under /resources
	     - resource-roots: maps the app namespace "learn.helloworld" to this folder ("./"),
	                     so the loader can find manifest.json, views and controllers
	     - async:      load everything asynchronously (required for Fiori launchpad)
	-->
	<script id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-resource-roots='{
				"learn.helloworld": "./"
			}'
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-compat-version="edge"
			data-sap-ui-async="true"></script>

	<!-- Once the core is ready, create a ComponentContainer that loads the
	     component named "learn.helloworld" (the app id from manifest.json)
	     and render it into the <body id="content">. async: true makes the
	     component load asynchronously, which is the recommended way. -->
	<script>
		sap.ui.getCore().attachInit(function () {
			sap.ui.require(["sap/ui/core/ComponentContainer"], function (ComponentContainer) {
				new ComponentContainer({
					name: "learn.helloworld",
					async: true,
					height: "100%"
				}).placeAt("content");
			});
		});
	</script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
