name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # test-headless.mjs drives the QUnit pages in headless Chrome;
      # ubuntu-latest images ship Google Chrome at this path.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests (headless QUnit)
        run: npm test
