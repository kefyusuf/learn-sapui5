name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs (a new push to the same PR) are cancelled immediately.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # test-headless.mjs drives the QUnit pages in headless Chrome;
      # ubuntu-latest images ship Google Chrome at this path.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      # actions are pinned by commit SHA (supply-chain hardening); the
      # comment keeps the human-readable version - dependabot updates the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # npm ci: installs exactly what package-lock.json pins - no drift.
        run: npm ci --no-audit --no-fund

      - name: Ensure Chrome is available
        run: |
          if ! command -v google-chrome && ! command -v google-chrome-stable; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
          fi

      - name: Lint (ui5lint per workspace + ESLint repo-wide)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests (headless QUnit)
        run: npm test

      - name: Build (ui5 build, all workspaces)
        run: npm run build --workspaces --if-present

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui5-dist
          path: examples/*/dist
          retention-days: 7
          if-no-files-found: error
